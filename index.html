<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --txt:#f5f5f5; --muted:#9a9a9a; --muted2:#6d6d6d;
      --card:rgba(255,255,255,.055); --card-hi:rgba(255,255,255,.10);
      --brd:rgba(255,255,255,.13); --brd-hi:rgba(255,255,255,.32);
      --err:#ff5d6c; --ok:#37d399; --gold:#ffd166;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;min-height:100dvh;}
    body{
      font-family:'Jost',sans-serif;
      color:var(--txt);
      background:
        radial-gradient(circle at 18% 12%, #232323, transparent 42%),
        radial-gradient(circle at 84% 88%, #1b1b1b, transparent 46%),
        linear-gradient(180deg,#0a0a0a,#000 60%);
      min-height:100dvh;
      display:flex; flex-direction:column; align-items:center;
      padding:48px 20px 120px;
    }
    .shell{ width:100%; max-width:980px; display:flex; flex-direction:column; align-items:center; }

    header{ text-align:center; margin-bottom:34px; }
    h1{
      margin:0; font-weight:700; font-size:clamp(30px,4vw,44px);
      letter-spacing:.3px;
      background:linear-gradient(135deg,#fff,#8a8a8a);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .sub{ margin-top:8px; color:var(--muted); font-size:15px; }

    .toolbar{
      width:100%; max-width:640px; display:flex; gap:10px; align-items:center;
      margin-bottom:34px;
    }
    .search{
      flex:1; background:var(--card); border:1px solid var(--brd); border-radius:12px;
      padding:12px 16px; color:var(--txt); font-family:'Jost',sans-serif; font-size:15px;
      outline:none; transition:border-color .15s;
    }
    .search::placeholder{ color:var(--muted2); }
    .search:focus{ border-color:var(--brd-hi); }

    .view-toggle{
      display:flex; gap:2px; background:var(--card); border:1px solid var(--brd);
      border-radius:12px; padding:4px; flex:none;
    }
    .view-toggle button{
      background:transparent; border:none; color:var(--muted); width:36px; height:34px;
      border-radius:9px; cursor:pointer; font-size:15px; display:flex;
      align-items:center; justify-content:center; transition:background .15s, color .15s;
    }
    .view-toggle button.active{ background:rgba(255,255,255,.16); color:#fff; }
    .view-toggle button:hover{ color:#fff; }

    .grid{ width:100%; }
    .grid.view-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:18px; }
    .grid.view-card{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px; }
    .grid.view-list{ display:flex; flex-direction:column; gap:10px; }

    .card{
      position:relative; background:var(--card); border:1px solid var(--brd);
      border-radius:18px; padding:26px 16px 16px; text-align:center; cursor:pointer;
      transition:transform .18s cubic-bezier(.16,1,.3,1), border-color .18s, background .18s;
    }
    .card:hover{ transform:translateY(-4px); border-color:var(--brd-hi); background:var(--card-hi); }
    .card .emoji{ font-size:38px; line-height:1; }
    .card .name{ margin-top:14px; font-size:15px; font-weight:500; word-break:break-word; }
    .card .meta{ margin-top:5px; font-size:11.5px; color:var(--muted2); }
    .card .actions{ margin-top:14px; display:flex; gap:6px; justify-content:center; }
    .card.card-modern{ text-align:left; padding:24px 20px 18px; }
    .card.card-modern .name{ margin-top:16px; font-size:16px; }
    .card.card-modern .actions{ justify-content:flex-start; }
    .pin-badge{ position:absolute; top:10px; left:12px; font-size:13px; }

    .row-item{
      display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--brd);
      border-radius:14px; padding:11px 16px; cursor:pointer; transition:background .15s,border-color .15s;
    }
    .row-item:hover{ background:var(--card-hi); border-color:var(--brd-hi); }
    .row-item .emoji{ font-size:22px; flex:none; }
    .row-item .name{ flex:1; font-size:14.5px; font-weight:500; text-align:left; }
    .row-item .actions{ display:flex; gap:6px; flex:none; }

    .icon-btn{
      width:29px; height:29px; border-radius:9px; border:1px solid var(--brd);
      background:rgba(255,255,255,.04); color:var(--muted); display:flex;
      align-items:center; justify-content:center; font-size:13.5px; cursor:pointer;
      transition:all .15s; flex:none;
    }
    .icon-btn:hover{ border-color:var(--brd-hi); color:#fff; }
    .icon-btn.star-btn.active{ color:var(--gold); border-color:rgba(255,209,102,.45); background:rgba(255,209,102,.1); }
    .icon-btn.pin-btn.active{ color:#fff; background:rgba(255,255,255,.18); border-color:var(--brd-hi); }
    .icon-btn.del:hover{ color:var(--err); border-color:var(--err); }

    .empty{
      grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 20px;
      border:1px dashed var(--brd); border-radius:18px; font-size:15px; width:100%;
    }

    .fab{
      position:fixed; right:26px; bottom:26px; width:58px; height:58px; border-radius:50%;
      background:linear-gradient(135deg,#fff,#c9c9c9); color:#000; border:none;
      font-size:26px; font-weight:600; cursor:pointer;
      box-shadow:0 14px 34px rgba(0,0,0,.55);
      display:flex; align-items:center; justify-content:center;
      transition:transform .15s;
    }
    .fab:hover{ transform:scale(1.06); }

    .modal-wrap{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.62); backdrop-filter:blur(4px);
      z-index:9998; align-items:flex-start; justify-content:center; overflow-y:auto; padding:6vh 16px;
    }
    .modal-wrap.show{ display:flex; }
    .modal{
      width:100%; max-width:420px; margin:auto; max-height:90dvh; overflow-y:auto;
      background:rgba(14,14,14,.97); border:1px solid var(--brd); border-radius:20px;
      padding:26px 24px 20px; box-shadow:0 30px 80px rgba(0,0,0,.7);
    }
    .modal h2{ margin:0 0 18px; font-size:19px; font-weight:600; text-align:center; }
    .field{ margin-bottom:14px; }
    .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
    .field input{
      width:100%; background:rgba(255,255,255,.05); border:1px solid var(--brd); border-radius:10px;
      padding:11px 13px; color:var(--txt); font-family:'Jost',sans-serif; font-size:14.5px; outline:none;
    }
    .field input:focus{ border-color:var(--brd-hi); }
    .emoji-row{ display:flex; align-items:center; gap:12px; }
    .emoji-row input{ width:64px; text-align:center; font-size:20px; flex:none; }
    .emoji-row .hint{ font-size:12px; color:var(--muted2); }
    .form-actions{
      position:sticky; bottom:-20px; background:rgba(14,14,14,.97);
      display:flex; gap:10px; padding-top:16px; margin-top:4px;
    }
    .btn{
      flex:1; border:none; border-radius:11px; padding:12px 14px; font-family:'Jost',sans-serif;
      font-size:14.5px; font-weight:600; cursor:pointer; transition:opacity .15s, transform .1s;
    }
    .btn:active{ transform:scale(.98); }
    .btn-primary{ background:linear-gradient(135deg,#fff,#c9c9c9); color:#000; }
    .btn-ghost{ background:transparent; border:1px solid var(--brd); color:var(--txt); }
    .btn-danger{ background:rgba(255,93,108,.14); color:var(--err); border:1px solid rgba(255,93,108,.4); }
    .btn:disabled{ opacity:.5; cursor:not-allowed; }

    .confirm .modal{ max-width:340px; text-align:center; }
    .confirm p{ color:var(--muted); font-size:14px; margin:0 0 20px; }

    .toasts{ position:fixed; top:18px; right:18px; z-index:10000; display:flex; flex-direction:column; gap:10px; }
    .toast{
      background:rgba(14,14,14,.96); border:1px solid var(--brd); border-radius:12px;
      padding:12px 16px; font-size:13.5px; min-width:200px; max-width:300px;
      box-shadow:0 12px 30px rgba(0,0,0,.5); animation:slideIn .2s cubic-bezier(.16,1,.3,1);
    }
    .toast.ok{ border-color:rgba(55,211,153,.4); }
    .toast.err{ border-color:rgba(255,93,108,.4); color:var(--err); }
    @keyframes slideIn{ from{ opacity:0; transform:translateX(16px);} to{ opacity:1; transform:translateX(0);} }

    footer{ margin-top:44px; color:var(--muted2); font-size:12px; text-align:center; }

    .conn-banner{
      display:none; align-items:center; gap:8px; position:fixed; top:14px; left:50%;
      transform:translateX(-50%); z-index:9999; background:rgba(255,93,108,.14);
      border:1px solid rgba(255,93,108,.4); color:var(--err); font-size:12.5px;
      padding:8px 14px; border-radius:999px;
    }
    .conn-banner a{ color:#fff; text-decoration:underline; cursor:pointer; }

    @media (max-width:520px){
      body{ padding:34px 14px 110px; }
      .grid.view-grid{ grid-template-columns:repeat(auto-fill,minmax(136px,1fr)); }
      .grid.view-card{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Command Center</h1>
      <div class="sub">All your Sheets, one tap away ⚡</div>
    </header>

    <div class="toolbar">
      <input class="search" id="search" placeholder="Search your projects…">
      <div class="view-toggle" id="viewToggle">
        <button data-view="grid" title="Grid view">▦</button>
        <button data-view="card" title="Card view">🗂️</button>
        <button data-view="list" title="List view">☰</button>
      </div>
    </div>

    <div class="grid view-grid" id="grid">
      <div class="empty">Loading your projects…</div>
    </div>

    <footer>Command Center · v1.2 · Built by Sam</footer>
  </div>

  <button class="fab" id="fabAdd" title="Add project">+</button>

  <!-- Add / Edit modal -->
  <div class="modal-wrap" id="formWrap">
    <div class="modal">
      <h2 id="formTitle">Add Project</h2>
      <div class="field">
        <label>Name</label>
        <input id="fName" placeholder="e.g. Meko Master" autocomplete="off">
      </div>
      <div class="field">
        <label>Google Sheet URL</label>
        <input id="fSheet" placeholder="https://docs.google.com/spreadsheets/…" autocomplete="off">
      </div>
      <div class="field">
        <label>Web App (GAS) URL</label>
        <input id="fGas" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      </div>
      <div class="field">
        <label>Emoji</label>
        <div class="emoji-row">
          <input id="fEmoji" maxlength="4" placeholder="🧩">
          <span class="hint">auto-picked from the name — edit if you want</span>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="formCancel">Cancel</button>
        <button class="btn btn-primary" id="formSave">Save Project 💾</button>
      </div>
    </div>
  </div>

  <!-- Delete confirm modal -->
  <div class="modal-wrap confirm" id="confirmWrap">
    <div class="modal">
      <h2>Remove this project?</h2>
      <p id="confirmText">This only removes it from Command Center — your Sheet stays untouched.</p>
      <div class="form-actions" style="position:static;">
        <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmYes">Remove</button>
      </div>
    </div>
  </div>

  <div class="conn-banner" id="connBanner"></div>

  <!-- Set backend URL modal (for when a redeploy changes the GAS URL) -->
  <div class="modal-wrap confirm" id="urlWrap">
    <div class="modal">
      <h2>Set Backend URL</h2>
      <div class="field">
        <label>GAS Web App URL</label>
        <input id="urlInput" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      </div>
      <div class="form-actions" style="position:static;">
        <button class="btn btn-ghost" id="urlCancel">Cancel</button>
        <button class="btn btn-primary" id="urlSave">Save &amp; Reload</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
    // Backend URL — hardcoded default + localStorage override, so a future
    // redeploy (which changes the /exec URL) doesn't need a new GitHub push;
    // just hit "Set URL" in the banner below.
    var API_DEFAULT = 'https://script.google.com/macros/s/AKfycbyyJ4_kadCHN2eCEMXAD3q1HJzkdz6wq2_5CwrmMbTc6W2UeHd9DdHbBLoL5KLLIQRs/exec';
    var API = localStorage.getItem('cc_api') || API_DEFAULT;

    function apiOk(u){
      return /\/macros\/s\/[^/]+\/exec$/.test(u) || /\/a\/macros\/[^/]+\/s\/[^/]+\/exec$/.test(u);
    }

    function apiCall(action, payload){
      var body = JSON.stringify(Object.assign({ action: action }, payload || {}));
      return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
        .then(function(res){ return res.json(); });
    }

    var projects = [];
    var editingId = null;
    var pendingDeleteId = null;
    var currentView = localStorage.getItem('cc_view') || 'grid';

    function esc(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    function toast(msg, kind){
      var el = document.createElement('div');
      el.className = 'toast ' + (kind || 'ok');
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(function(){ el.remove(); }, 3200);
    }

    // lightweight client-side mirror of the server's auto-emoji picker (live preview only)
    function guessEmoji(name){
      var n = (name || '').toLowerCase();
      var rules = [
        [/med|pharma|tablet|drug|dose/, '💊'], [/vehicle|car|chassis|manbi|transport|flow/, '🚚'],
        [/task|todo|remind|pwrs|remi/, '✅'], [/pass|vault|meko|secret|key/, '🔐'],
        [/fms|factory|mine|ops|plant|production/, '🏭'], [/sale|order|invoice|bill|money|pay/, '💰'],
        [/report|analytic|dashboard|stat|chart/, '📊'], [/user|team|hr|staff|employee/, '👥'],
        [/mail|email|inbox/, '📧'], [/calendar|schedule|event|plan/, '📅'],
        [/doc|file|drive|note/, '📁'], [/bot|chat|ai|assist|kiraan/, '🤖'],
        [/portfolio|site|web|page|index/, '🌐'], [/stock|inventory|warehouse/, '📦']
      ];
      for (var i=0;i<rules.length;i++) if (rules[i][0].test(n)) return rules[i][1];
      var fb = ['🧩','⚙️','🗂️','🧭','🚀','🛠️','🔷','✨'];
      var h=0; for (var j=0;j<n.length;j++) h=(h*31+n.charCodeAt(j))>>>0;
      return fb[h % fb.length];
    }

    // ---------- render (grid / card / list) ----------
    function sortForDisplay(list){
      var arr = list.slice();
      arr.sort(function(a,b){ return (b.pinned?1:0) - (a.pinned?1:0); }); // pinned float to top, stable
      return arr;
    }

    function actionIcons(p){
      return '' +
        '<div class="icon-btn star-btn' + (p.starred?' active':'') + '" data-act="star" data-id="'+esc(p.id)+'" title="Star">' + (p.starred?'⭐':'☆') + '</div>' +
        '<div class="icon-btn pin-btn' + (p.pinned?' active':'') + '" data-act="pin" data-id="'+esc(p.id)+'" title="Pin to top">📌</div>' +
        '<div class="icon-btn del" data-act="delete" data-id="'+esc(p.id)+'" title="Remove">✕</div>';
    }

    function cardHTML(p, modern){
      var linkMeta = p.gasUrl ? 'Web app linked' : (p.sheetUrl ? 'Sheet linked' : 'No link yet');
      return '' +
        '<div class="card' + (modern?' card-modern':'') + '" data-id="'+esc(p.id)+'">' +
          (p.pinned ? '<div class="pin-badge">📌</div>' : '') +
          '<div class="emoji">'+esc(p.emoji||'🧩')+'</div>' +
          '<div class="name">'+esc(p.name)+'</div>' +
          (modern ? '<div class="meta">'+linkMeta+'</div>' : '') +
          '<div class="actions">' + actionIcons(p) + '</div>' +
        '</div>';
    }

    function listRowHTML(p){
      return '' +
        '<div class="row-item" data-id="'+esc(p.id)+'">' +
          '<div class="emoji">'+esc(p.emoji||'🧩')+'</div>' +
          '<div class="name">'+esc(p.name)+ (p.pinned?' 📌':'') +'</div>' +
          '<div class="actions">' + actionIcons(p) + '</div>' +
        '</div>';
    }

    function render(list){
      var grid = document.getElementById('grid');
      grid.className = 'grid view-' + currentView;
      if (!list.length){
        grid.innerHTML = '<div class="empty">Nothing here yet. Tap + and add your first project. 🚀</div>';
        return;
      }
      var sorted = sortForDisplay(list);
      if (currentView === 'list'){
        grid.innerHTML = sorted.map(listRowHTML).join('');
      } else {
        grid.innerHTML = sorted.map(function(p){ return cardHTML(p, currentView === 'card'); }).join('');
      }
    }

    function currentFilteredList(){
      var q = document.getElementById('search').value.trim().toLowerCase();
      return !q ? projects : projects.filter(function(p){ return p.name.toLowerCase().indexOf(q) > -1; });
    }
    function applyFilter(){ render(currentFilteredList()); }

    function setView(v){
      currentView = v;
      localStorage.setItem('cc_view', v);
      document.querySelectorAll('#viewToggle button').forEach(function(b){
        b.classList.toggle('active', b.dataset.view === v);
      });
      applyFilter();
    }

    function loadProjects(){
      apiCall('list').then(function(res){
        if (!res.ok){ toast(res.error || 'Could not load', 'err'); return; }
        projects = res.projects || [];
        applyFilter();
      }).catch(function(err){
        toast('Load failed: ' + err.message, 'err');
        showConnBanner();
      });
    }

    function showConnBanner(){
      var b = document.getElementById('connBanner');
      b.style.display = 'flex';
      b.innerHTML = '⚠️ Can\'t reach backend — <a id="setUrlLink">Set URL</a>';
      document.getElementById('setUrlLink').onclick = openUrlModal;
    }

    var urlWrap = document.getElementById('urlWrap');
    function openUrlModal(){
      document.getElementById('urlInput').value = API;
      urlWrap.classList.add('show');
    }
    document.getElementById('urlCancel').onclick = function(){ urlWrap.classList.remove('show'); };
    document.getElementById('urlSave').onclick = function(){
      var v = document.getElementById('urlInput').value.trim();
      if (!v || !apiOk(v)){ toast('Needs a valid …/exec URL', 'err'); return; }
      localStorage.setItem('cc_api', v);
      toast('Saved — reloading…');
      setTimeout(function(){ location.reload(); }, 600);
    };

    function openProject(p){
      var url = p.gasUrl || p.sheetUrl;
      if (!url){ toast('No link added for this project yet', 'err'); return; }
      window.open(url, '_blank');
    }

    // --- add/edit modal ---
    var formWrap = document.getElementById('formWrap');
    function openForm(p){
      editingId = p ? p.id : null;
      document.getElementById('formTitle').textContent = p ? 'Edit Project' : 'Add Project';
      document.getElementById('fName').value = p ? p.name : '';
      document.getElementById('fSheet').value = p ? (p.sheetUrl || '') : '';
      document.getElementById('fGas').value = p ? (p.gasUrl || '') : '';
      document.getElementById('fEmoji').value = p ? (p.emoji || '') : '';
      document.getElementById('fEmoji').dataset.touched = p ? '1' : '';
      formWrap.classList.add('show');
      setTimeout(function(){ document.getElementById('fName').focus(); }, 50);
    }
    function closeForm(){ formWrap.classList.remove('show'); }

    document.getElementById('fabAdd').onclick = function(){ openForm(null); };
    document.getElementById('formCancel').onclick = closeForm;
    document.getElementById('fName').addEventListener('input', function(){
      var e = document.getElementById('fEmoji');
      if (!e.dataset.touched) e.value = guessEmoji(this.value);
    });
    document.getElementById('fEmoji').addEventListener('input', function(){ this.dataset.touched = '1'; });

    document.getElementById('formSave').onclick = function(){
      var name = document.getElementById('fName').value.trim();
      if (!name){ toast('Name is needed', 'err'); return; }
      var payload = {
        id: editingId,
        name: name,
        sheetUrl: document.getElementById('fSheet').value.trim(),
        gasUrl: document.getElementById('fGas').value.trim(),
        emoji: document.getElementById('fEmoji').value.trim()
      };
      var btn = document.getElementById('formSave');
      btn.disabled = true; btn.textContent = 'Saving…';
      apiCall(editingId ? 'update' : 'add', payload).then(function(res){
        btn.disabled = false; btn.textContent = 'Save Project 💾';
        if (!res.ok){ toast(res.error || 'Save failed', 'err'); return; }
        closeForm();
        toast(editingId ? 'Project updated ✅' : 'Project added ✅');
        loadProjects();
      }).catch(function(err){
        btn.disabled = false; btn.textContent = 'Save Project 💾';
        toast('Save failed: ' + err.message, 'err');
      });
    };

    // --- delete confirm ---
    var confirmWrap = document.getElementById('confirmWrap');
    document.getElementById('confirmCancel').onclick = function(){ confirmWrap.classList.remove('show'); };
    document.getElementById('confirmYes').onclick = function(){
      if (!pendingDeleteId) return;
      var id = pendingDeleteId;
      confirmWrap.classList.remove('show');
      apiCall('delete', { id: id }).then(function(res){
        if (!res.ok){ toast(res.error || 'Delete failed', 'err'); return; }
        toast('Removed 🗑️');
        loadProjects();
      }).catch(function(err){
        toast('Delete failed: ' + err.message, 'err');
      });
    };

    // --- grid interactions: open / pin / star / delete / edit ---
    document.getElementById('grid').addEventListener('click', function(e){
      var actBtn = e.target.closest('[data-act]');
      var item = e.target.closest('[data-id]');
      if (!item) return;
      var id = item.dataset.id;
      var p = projects.find(function(x){ return x.id === id; });
      if (!p) return;

      if (actBtn){
        e.stopPropagation();
        var act = actBtn.dataset.act;

        if (act === 'delete'){
          pendingDeleteId = id;
          document.getElementById('confirmText').textContent =
            'Remove "' + p.name + '" from Command Center? Your Sheet stays untouched.';
          confirmWrap.classList.add('show');
          return;
        }

        if (act === 'pin' || act === 'star'){
          var field = act === 'pin' ? 'pinned' : 'starred';
          var prev = p[field];
          p[field] = !prev; // optimistic
          applyFilter();
          apiCall(act, { id: id }).then(function(res){
            if (!res.ok){ p[field] = prev; applyFilter(); toast(res.error || 'Update failed', 'err'); }
          }).catch(function(err){
            p[field] = prev; applyFilter();
            toast('Update failed: ' + err.message, 'err');
          });
          return;
        }
      }

      openProject(p);
    });

    document.getElementById('grid').addEventListener('dblclick', function(e){
      var item = e.target.closest('[data-id]');
      if (!item) return;
      var p = projects.find(function(x){ return x.id === item.dataset.id; });
      if (p) openForm(p);
    });

    document.getElementById('search').addEventListener('input', applyFilter);

    document.getElementById('viewToggle').addEventListener('click', function(e){
      var b = e.target.closest('button');
      if (!b) return;
      setView(b.dataset.view);
    });
    document.querySelectorAll('#viewToggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.view === currentView);
    });

    loadProjects();
  </script>
</body>
</html>
